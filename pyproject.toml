[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intervendb"
version = "0.1.0"
description = "Intervention-aware risk cubes for robust model selection under hidden environment shift."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "IntervenDB Authors" }
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "PyYAML",
  "duckdb",
  "pyarrow",
  "remotezip",
  "tabulate"
]

[project.optional-dependencies]
baselines = [
  "xgboost==2.1.4",
  "lightgbm==4.6.0",
  "catboost==1.2.10",
  "pyod==1.1.3",
  "interpret-core==0.4.4"
]

[tool.setuptools.packages.find]
where = ["src"]
