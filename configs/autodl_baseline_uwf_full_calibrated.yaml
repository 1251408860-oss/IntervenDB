random_state: 42
test_size: 0.35
validation_size: 0.25
output_dir: results/autodl_baselines_uwf_full_calibrated
save_predictions: false

validation:
  strategy: attack_family_challenge
  min_group_rows: 50
  max_groups: 1
  max_rows: 5000
  benign_ratio: 1.0

calibration:
  enabled: true
  threshold_grid_size: 101
  refit_on_full_train: true
  policies:
    - native_default
    - val_observed_f1
    - val_robust_minimax
    - oracle_env_upper_bound

dataset:
  type: uwf
  raw_dir: data/raw/uwf_zeekdata24
  max_rows_per_family: 1000000

splits:
  - random
  - time
  - source_ip
  - heldout_family

detectors:
  - lr_full
  - rf_full
  - gb_full
  - xgb_full
  - lgbm_full
  - cat_full
  - iforest_env_sensitive
  - pyod_ecod_env_sensitive
  - pyod_copod_env_sensitive

interventions:
  observed:
    seed: 42
  low_sampling:
    sampling_rate: 0.20
    seed: 43
  congested_link:
    duration_multiplier: 8.0
    packet_jitter: 4.0
    seed: 44
  high_background:
    background_byte_multiplier: 4.0
    packet_jitter: 8.0
    seed: 45
  delayed_collector:
    timestamp_shift: 21600.0
    seed: 46



